[workspace]
resolver = "3"
members = [
  "crates/*",
  "tauri",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.90"
authors = ["lgou2w <lgou2w@hotmail.com>"]
description = "An unofficial tool for managing and analyzing your miHoYo gacha records"
homepage = "https://github.com/lgou2w/HoYo.Gacha#readme"
repository = "https://github.com/lgou2w/HoYo.Gacha"
readme = "../README.md"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# HoYo.Gacha crates
hg_diskcache   = { package = "hoyo_gacha_diskcache"   , path = "./crates/diskcache" }
hg_ffi         = { package = "hoyo_gacha_ffi"         , path = "./crates/ffi" }
hg_gamebiz     = { package = "hoyo_gacha_gamebiz"     , path = "./crates/gamebiz" }
hg_metadata    = { package = "hoyo_gacha_metadata"    , path = "./crates/metadata" }
hg_url_parser  = { package = "hoyo_gacha_url_parser"  , path = "./crates/url_parser" }
hg_url_scraper = { package = "hoyo_gacha_url_scraper" , path = "./crates/url_scraper" }

# Other crates
cfg-if = "1.0.5"
deadpool = { version = "0.13.1", default-features = false }
deadpool-sync = { version = "0.2.0", default-features = false }
exponential-backoff = { version = "2.1.1", default-features = false }
form_urlencoded = { version = "1.2.2", default-features = false, features = ["std"] }
os_info = { version = "3.15.0", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
rusqlite = { version = "0.40.2", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
snafu = { version = "0.9.2", default-features = false, features = ["std", "rust_1_81", "backtraces-impl-backtrace-crate"] }
tauri = { version = "2.12.5", default-features = false }
tauri-build = { version = "2.7.4", default-features = false }
tauri-plugin-clipboard-manager = { version = "2.5.0", default-features = false }
tauri-plugin-shell = { version = "2.5.0", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
windows = { version = "0.62.2", default-features = false, features = ["std"] }
windows-version = { version = "0.1.7", default-features = false }
webview2-com = { version = "0.39.1", default-features = false }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
